version: '3.9'

services:
  backend:
    build:
      context: ./services/backend
      dockerfile: Dockerfile
    container_name: mealway-backend-dev
    ports:
      - "8000:8000"
    env_file:
      - .env.dev
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./services/backend:/app
      - /app/__pycache__
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - mealway-net
    depends_on:
      - postgres
    restart: unless-stopped


  postgres:
    image: postgres:15-alpine
    container_name: mealway-postgres-dev
    env_file:
      - .env.dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mealway-net
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: mealway-prometheus-dev
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data_dev:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - mealway-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: mealway-grafana-dev
    ports:
      - "3001:3000"
    env_file:
      - .env.dev
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_INSTALL_PLUGINS: grafana-clock-panel
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - grafana_data_dev:/var/lib/grafana
    networks:
      - mealway-net
    depends_on:
      - prometheus
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: mealway-clickhouse-dev
    environment:
      CLICKHOUSE_DB: langfuse
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
    ports:
      - "8123:8123"   # HTTP
      - "9000:9000"   # Native
    volumes:
      - clickhouse_data_dev:/var/lib/clickhouse
    networks:
      - mealway-net
    restart: unless-stopped

  langfuse:
    image: ghcr.io/langfuse/langfuse:latest
    container_name: mealway-langfuse-dev
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/langfuse_dev
      NEXTAUTH_SECRET: "dev-secret-key-change-in-production"
      NEXTAUTH_URL: http://localhost:3000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      #REDIS_CONNECTION_STRING: redis://redis:6379
      #LANGFUSE_S3_EVENT_UPLOAD_BUCKET: local-dev-bucket
    volumes:
      - langfuse_data_dev:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - mealway-net
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_started
    restart: unless-stopped 


  promtail:
    image: grafana/promtail:2.9.2
    container_name: mealway-promtail-dev
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - mealway-net
    depends_on:
      - loki
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9.2
    container_name: mealway-loki-dev
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data_dev:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - mealway-net
    restart: unless-stopped


volumes:
  postgres_data_dev:
  langfuse_data_dev:
  prometheus_data_dev:
  grafana_data_dev:
  loki_data_dev:
  clickhouse_data_dev:
    driver: local

networks:
  mealway-net:
    driver: bridge
