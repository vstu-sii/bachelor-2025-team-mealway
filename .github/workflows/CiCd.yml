name: CI CD Pipeline

on: 
  push:
    branches:
      - dev
    paths:
      - 'services\backend\app\**'
      - 'services\frontend\**'
  pull_request:
    branches:
      - dev
    paths:
      - 'services\backend\app\**'
      - 'services\frontend\**'



jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/backend  
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache pip
        id: cache-pips
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('services/backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install deps
        run: pip install -r requirements.txt  
      - name: Lint
        run: ruff check app --fix
      - name: Formatting
        run: black app
      - name: Type Check
        run: mypy app --disallow-untyped-defs --ignore-missing-imports --warn-unused-ignores

  test:
    needs: [lint]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('services/backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Test
        run: |
          export PYTHONPATH=.
          pytest -v --disable-warnings --maxfail=1 --cov=app tests
